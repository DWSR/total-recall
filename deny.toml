[advisories]
version = 2
# unsafe-libyaml (via deprecated serde_yaml, used by integration engine fakes)
# is unmaintained with no safe upgrade; replacing it is a separate migration.
ignore = ["RUSTSEC-2024-0449"]

[licenses]
version = 2
private = { ignore = true }
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
